<!doctype html>
<html lang="sv">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="icon"
    type="image/png"
    href="/scrum-manager-logo.png"
  />

  <title>Scrum Manager | Projekt</title>
  </head>

  <body>

    <aside class="sidebar">

    <header class="sidebar__logo">
  <img
    src="/scrum-manager-logo.png"
    alt=""
    class="sidebar__logo-image"
  />

  <span>Scrum Manager</span>
    </header>

<nav class="sidebar__nav" aria-label="Huvudnavigation">

    
    <a href="#home-container"
      class="sidebar__link"
      id="nav-home">
        <i data-lucide="home"></i>
        <span>Hem</span>
    </a>


    <a href="#projects-container"
       class="sidebar__link sidebar__link--active"
       id="nav-projects">
        <i data-lucide="folder"></i>
        <span>Projekt</span>
    </a>
    
    <button type="button"
            class="sidebar__link"
            id="nav-members">
        <i data-lucide="users-round"></i>
        <span>Medlemmar</span>
    </button>

    <button type="button"
            class="sidebar__link"
            id="nav-add-member">
        <i data-lucide="user-round-plus"></i>
        <span>Ny medlem</span>
    </button>

</nav>

    </aside>
<main class="dashboard" id="app">
    <!-- Här renderar TypeScript den aktuella sidan -->
</main>


    <script type="module" src="/src/main.ts"></script>
