<!doctype html>
<html lang="sv">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="icon"
    type="image/png"
    href="/scrum-manager-logo.png"
  />

  <title>Scrum Manager | Projekt</title>
  </head>

  <body>

    <aside class="sidebar">

    <header class="sidebar__logo">
  <img
    src="/scrum-manager-logo.png"
    alt=""
    class="sidebar__logo-image"
  />

  <span>Scrum Manager</span>
    </header>

<nav class="sidebar__nav" aria-label="Huvudnavigation">

    <a href="#projects-container"
       class="sidebar__link sidebar__link--active"
       id="nav-projects">
        <i data-lucide="folder"></i>
        <span>Projekt</span>
    </a>

    <button type="button"
            class="sidebar__link"
            id="nav-progress">
        <i data-lucide="chart-no-axes-column-increasing"></i>
        <span>Progress</span>
    </button>

    <button type="button"
            class="sidebar__link"
            id="nav-add-member">
        <i data-lucide="user-round-plus"></i>
        <span>Ny medlem</span>
    </button>

</nav>

    </aside>

    <main class="dashboard">

      <header class="dashboard__header">

        <div>
          <h2>Alla projekt</h2>
          <p>
            Visa kategori, medlemmar och sortera i deadline.
          </p>
        </div>


        <div class="dashboard__controls">

          <label>
            <span>Projekt</span>

            <select id="category-filter">
              <option value="all">Alla</option>
            </select>
          </label>


          <label>
            <span>Medlemmar</span>

            <select id="member-filter">
              <option value="all">Alla</option>
            </select>
          </label>


          <label>
            <!--Can we write Sortera uppgifter so that the user knows what the dropdown is sorting-->
            <span>Sortera</span>
             <!--The sorting is supposed to be for the tasks if I understood the instructions right? Should we rename the ID?-->
            <select id="project-sort">
               <option value="sortAZ">
               Titel A->Ö
              </option>
               <option value="sortZA">
               Titel Ö->A
              </option>
              <option value="closestDeadline ">
                Deadline (närmast)
              </option>
               <option value="farthestDeadline">
                Deadline (längst bort)
              </option>
             
            </select>
          </label>


          <button id="new-project-button" type="button">
            + Nytt projekt
          </button>

        </div>

      </header>

      <section id="projects-container" class="projects-container">
        <!-- TypeScript -->
      </section>
      <section
        id="project-list"
        class="project-list"
        aria-label="Alla projekt"
      >
      </section>

    </main>


    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
